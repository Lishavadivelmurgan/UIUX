<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<br>
    <h2>Image Slider</h2>
    <img id="image" src="images/pair.jpg"  width="900" height="700">
    <br></br>
    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>
    <script>
        let images=["images/pair.jpg","images/ele.jpg","images/girl.jpg","images/panda.jpg"];
        let i=0;
        function next(){
            i++;
            if(i==images.length){
                i=0;
            }
            document.getElementById("image").src=images[i];
        }
        function previous(){
            i--;
            if(i<0){
                i=images.length-1;
            }
            document.getElementById("image").src=images[i];
        }
        setInterval(next,1000);
    </script>
</body>
</html>
